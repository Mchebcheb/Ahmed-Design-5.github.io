    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
        body {
            background-color: #0d0d0d !important;
            color: #cccccc !important;
            font-family: 'Segoe UI', Roboto, sans-serif !important;
            margin: 0 !important;
            padding: 20px 20px !important;
            /* Reducimos el padding general del body para ganar espacio */
        }

        .presupuesto-container {
            max-width: 950px !important;
            margin: 30px auto !important;
            /* Margen superior e inferior controlado */
            background-color: #141414 !important;
            padding: 25px 40px !important;
            /* <--- Menos altura arriba y abajo dentro de la caja */
            border-radius: 12px !important;
            border: 1px solid #00bcd4 !important;
            box-shadow: 0 15px 35px rgba(0, 188, 212, 0.2) !important;
            box-sizing: border-box !important;
        }

        .presupuesto-container h2 {
            color: #00bcd4 !important;
            font-size: 2rem !important;
            margin-top: 0 !important;
            margin-bottom: 20px !important;
            /* Menos espacio para ganar compacidad */
            text-align: center !important;
        }

        .form-group {
            margin-bottom: 15px !important;
            /* Reducido para que no sea tan alto */
        }

        .form-group label {
            display: block !important;
            margin-bottom: 6px !important;
            color: #ffffff !important;
            font-size: 1.05rem !important;
            font-weight: 500 !important;
        }

        .form-control {
            width: 100% !important;
            padding: 11px 15px !important;
            /* Inputs ligeramente más compactos en altura */
            font-size: 1rem !important;
            border: 1px solid #333 !important;
            border-radius: 8px !important;
            background-color: #1f1f1f !important;
            color: #ffffff !important;
            box-sizing: border-box !important;
        }

        .form-control:focus {
            outline: none !important;
            border-color: #00bcd4 !important;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.3) !important;
        }

        .botones-container {
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 15px !important;
            align-items: center !important;
            margin-top: 20px !important;
        }

        .btn-enviar {
            background-color: #00bcd4 !important;
            color: #0d0d0d !important;
            border: none !important;
            padding: 12px 25px !important;
            font-size: 1.05rem !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            font-weight: bold !important;
            transition: all 0.3s ease !important;
            flex: 1 !important;
            min-width: 180px !important;
            box-sizing: border-box !important;
            text-align: center !important;
        }

        .btn-enviar:hover {
            background-color: #008ba3 !important;
            color: #ffffff !important;
        }

        .btn-volver {
            background-color: transparent !important;
            color: #00bcd4 !important;
            border: 1px solid #00bcd4 !important;
            padding: 11px 25px !important;
            font-size: 1.05rem !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            font-weight: bold !important;
            text-decoration: none !important;
            display: inline-block !important;
            transition: all 0.3s ease !important;
            flex: 1 !important;
            min-width: 180px !important;
            box-sizing: border-box !important;
            text-align: center !important;
            margin-left: 0 !important;
        }

        .btn-volver:hover {
            background-color: #00bcd4 !important;
            color: #0d0d0d !important;
        }


        @media (max-width: 600px) {
            .presupuesto-container {
                padding: 20px 15px !important;
                margin: 15px 10px !important;
            }

            .botones-container {
                flex-direction: column !important;
            }

            .btn-enviar,
            .btn-volver {
                width: 100% !important;
                min-width: 100% !important;
            }
        }
    </style>
</head>

        <!-- Capa oscura semitransparente para que los textos resalten siempre -->
        <div class="hero-overlay"></div>

        <!-- Contenido de tu Header (Títulos, subtítulos, botones, etc.) -->
        <div class="hero-content">

            <div class="presupuesto-container">
                <h2>Solicitud de Presupuesto</h2>

                <form action="https://formspree.io/f/xnjlzeap" method="POST">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="mensaje">Descripción de la obra:</label>
                        <textarea id="mensaje" name="mensaje" rows="5" class="form-control" required></textarea>
                    </div>

                    <div class="botones-container">
                        <button type="submit" class="btn-enviar">Enviar Solicitud</button>
                        <a href="index.html" class="btn-volver">Volver al Inicio</a>
                    </div>
                </form>
            </div>
