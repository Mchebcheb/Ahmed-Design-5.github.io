<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>Ahmed Design | Solicitud de Presupuesto</title>

    <link rel="stylesheet" href="responsive.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>
        body {
            background-color: #0d0d0d !important;
            color: #cccccc !important;
            font-family: 'Segoe UI', Roboto, sans-serif !important;
            margin: 0 !important;
            padding: 20px 20px !important;
        }

        .presupuesto-container {
            max-width: 950px !important;
            margin: 0 auto !important;
            background-color: rgba(20, 20, 20, 0.95) !important;
            padding: 25px 40px !important;
            border-radius: 12px !important;
            border: 1px solid #00bcd4 !important;
            box-shadow: 0 15px 35px rgba(0, 188, 212, 0.2) !important;
            box-sizing: border-box !important;
            position: relative;
            z-index: 3;
            text-align: left !important;
        }

        .presupuesto-container h2 {
            color: #00bcd4 !important;
            font-size: 2rem !important;
            margin-top: 0 !important;
            margin-bottom: 20px !important;
            text-align: center !important;
        }

        .form-group {
            margin-bottom: 15px !important;
        }

        .form-group label {
            display: block !important;
            margin-bottom: 6px !important;
            color: #ffffff !important;
            font-size: 1.05rem !important;
            font-weight: 500 !important;
        }

        .form-control {
            width: 100% !important;
            padding: 11px 15px !important;
            font-size: 1rem !important;
            border: 1px solid #333 !important;
            border-radius: 8px !important;
            background-color: #1f1f1f !important;
            color: #ffffff !important;
            box-sizing: border-box !important;
        }

        .form-control:focus {
            outline: none !important;
            border-color: #00bcd4 !important;
            box-shadow: 0 0 10px rgba(0, 188, 212, 0.3) !important;
        }

        .botones-container {
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 15px !important;
            align-items: center !important;
            margin-top: 20px !important;
        }

        .btn-enviar {
            background-color: #00bcd4 !important;
            color: #0d0d0d !important;
            border: none !important;
            padding: 12px 25px !important;
            font-size: 1.05rem !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            font-weight: bold !important;
            transition: all 0.3s ease !important;
            flex: 1 !important;
            min-width: 180px !important;
            box-sizing: border-box !important;
            text-align: center !important;
        }

        .btn-enviar:hover {
            background-color: #008ba3 !important;
            color: #ffffff !important;
        }

        .btn-volver {
            background-color: transparent !important;
            color: #00bcd4 !important;
            border: 1px solid #00bcd4 !important;
            padding: 11px 25px !important;
            font-size: 1.05rem !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            font-weight: bold !important;
            text-decoration: none !important;
            display: inline-block !important;
            transition: all 0.3s ease !important;
            flex: 1 !important;
            min-width: 180px !important;
            box-sizing: border-box !important;
            text-align: center !important;
            margin-left: 0 !important;
        }

        .btn-volver:hover {
            background-color: #00bcd4 !important;
            color: #0d0d0d !important;
        }

        /* Estilos del Slider de Fondo */
        .servicios-hero-slider {
            position: relative;
            width: 100%;
            min-height: 85vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000000;
            padding: 40px 0;
            box-sizing: border-box;
        }

        .slider-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            animation: sliderAnimation 18s infinite;
        }

        .slide-1 {
            background-image: url('servicio-1.jpg');
            animation-delay: 0s;
        }

        .slide-2 {
            background-image: url('servicio-2.jpg');
            animation-delay: 6s;
        }

        .slide-3 {
            background-image: url('servicio-3.jpg');
            animation-delay: 12s;
        }

        .slider-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 0 20px;
            box-sizing: border-box;
        }

        @keyframes sliderAnimation {
            0% {
                opacity: 0;
                transform: scale(1);
            }

            4% {
                opacity: 1;
            }

            33% {
                opacity: 1;
                transform: scale(1.04);
            }

            37% {
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .presupuesto-container {
                padding: 20px 15px !important;
            }

            .botones-container {
                flex-direction: column !important;
            }

            .btn-enviar,
            .btn-volver {
                width: 100% !important;
                min-width: 100% !important;
            }
        }
    </style>
</head>

    <!-- Carrusel de 3 Imágenes de Fondo con el Formulario de Presupuesto Encima -->
    <section class="servicios-hero-slider">
        <div class="slider-container">
            <div class="slide slide-1"></div>
            <div class="slide slide-2"></div>
            <div class="slide slide-3"></div>
        </div>
        <div class="slider-overlay"></div>
        <div class="Aprender">
            <div class="hero-content">
                <div class="presupuesto-container">
                    <h2>Solicitud de Presupuesto</h2>

                    <form action="https://formspree.io/f/xnjlzeap" method="POST">
                        <!-- Campo oculto para mantenerte en presupuesto2.html tras enviar -->
                        <input type="hidden" name="_next" value="presupuesto2.html">

                        <div class="form-group">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Correo Electrónico:</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="mensaje">Descripción de la obra:</label>
                            <textarea id="mensaje" name="mensaje" rows="5" class="form-control" required></textarea>
                        </div>

                        <div class="botones-container">
                            <button type="submit" class="btn-enviar">Enviar Solicitud</button>
                            <a href="servicios.html" class="btn-volver">Volver a Servicios</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
